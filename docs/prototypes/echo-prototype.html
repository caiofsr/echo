<div class="intro">PROTÓTIPO DESCARTÁVEL · Dados fictícios, mantidos só nesta página. Avalie como organizar quadro, horas e faturas no computador e celular. Recarregar reinicia tudo.</div>
<div class="shell"><aside><div class="brand">echo<span> ◦</span></div><nav id="nav"></nav></aside><main><div id="timer"></div><div id="content"></div><details><summary>Simular situações e conferir estado</summary><div class="row toolbar"><button onclick="online=!online;render()">Alternar conexão</button><button onclick="conflict=true;openManual()">Simular sobreposição</button><button onclick="remote=true;notify('Outro dispositivo alterou o cronômetro. A próxima ação vai pedir atualização.')">Simular outro dispositivo</button><button onclick="location.reload()">Reiniciar demonstração</button></div><div id="state"></div></details></main></div>
<div class="switcher"><button aria-label="Variante anterior" onclick="variant(-1)">←</button><span id="variantName"></span><button aria-label="Próxima variante" onclick="variant(1)">→</button></div><dialog id="dialog"></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='Quadro',online=true,remote=false,conflict=false,col=0,archived=false,variantKey=new URLSearchParams(location.search).get('variant')||'A';
const columns=['A fazer','Em andamento','Concluído'];let tasks=[{id:1,title:'Criar página de apresentação',description:'Revisar conteúdo e estrutura',project:'Site institucional',col:0},{id:2,title:'Ajustar navegação mobile',description:'Validar navegação no celular',project:'Site institucional',col:1},{id:3,title:'Organizar ideias',description:'',project:'',col:0}];
let records=[{id:1,task:2,description:'Ajustes no menu',project:'Site institucional',start:'2026-10-19T09:00',end:'2026-10-19T10:15',seconds:4500,locked:false},{id:2,task:null,description:'Planejamento livre',project:'',start:'2026-10-19T10:30',end:'2026-10-19T11:00',seconds:1800,locked:false}];let projects=[{name:'Site institucional',client:'Estúdio Aurora',rate:150,currency:'BRL',archived:false}],clients=[{name:'Estúdio Aurora',archived:false}],invoices=[],active=null,last=null,nextNumber=12,prefs={rate:150,zone:'America/Recife'},payments=['Transferência bancária'],company={};
const duration=s=>[Math.floor(s/3600),Math.floor(s%3600/60),Math.floor(s%60)].map(n=>String(n).padStart(2,'0')).join(':'),money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),opts=(selected='',blank=true)=>`${blank?'<option value="">Sem projeto</option>':''}${projects.filter(p=>!p.archived).map(p=>`<option ${p.name===selected?'selected':''}>${esc(p.name)}</option>`).join('')}`;
function notify(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4500)}
function guard(){if(!online){notify('Sem conexão. Reconecte para salvar esta ação.');return false}if(remote){remote=false;notify('Cronômetro atualizado por outro dispositivo. Confira o estado e repita a ação.');render();return false}return true}
function modal(s){$('#dialog').innerHTML=s;$('#dialog').showModal()}function closeModal(){$('#dialog').close()}function total(t){return records.filter(r=>r.task===t.id).reduce((n,r)=>n+r.seconds,0)+(active?.task===t.id?(Date.now()-active.since)/1000:0)}
function start(id){if(!guard())return;if(active?.task===id&&id!=null){notify('Esta tarefa já está em andamento.');return}const draftDescription=$('#timer input')?.value||'',draftProject=$('#timer select')?.value||'';if(active)stop(true);const t=tasks.find(t=>t.id===id);active={task:id||null,description:t?(t.description||t.title):draftDescription,project:t?t.project:draftProject,since:Date.now()};render()}
function stop(silent=false){if(!silent&&!guard())return;if(!active)return;last={...active};records.push({id:Date.now(),task:active.task,description:active.description,project:active.project,start:new Date(active.since).toISOString().slice(0,16),end:new Date().toISOString().slice(0,16),seconds:Math.max(1,Math.floor((Date.now()-active.since)/1000)),rate:projects.find(p=>p.name===active.project)?.rate||prefs.rate});active=null;render();if(!silent)notify('Período salvo. Retomar criará um novo registro.')}
function resume(){if(!guard()||!last)return;active={...last,since:Date.now()};render()}
function render(){document.body.className='v'+variantKey;$('#variantName').textContent=({A:'A · Quadro com navegação lateral',B:'B · Navegação no topo',C:'C · Lista compacta por coluna'})[variantKey];$('#nav').innerHTML=['Quadro','Horas','Faturas','Cadastros','Configurações'].map(p=>`<button class="${page===p?'active':''}" onclick="page='${p}';render()">${p}</button>`).join('');$('#timer').innerHTML=`${!online?'<div class="notice">Sem conexão. A contagem continua; as ações de escrita aguardam reconexão.</div>':''}<div class="timer"><span class="badge">${active?'Em andamento':'Cronômetro global'}</span><span class="time" id="clock">${duration(active?(Date.now()-active.since)/1000:0)}</span><input aria-label="Descrição do período" placeholder="No que você está trabalhando?" value="${esc(active?.description||'')}" ${!online?'disabled':''} onchange="if(active&&guard())active.description=this.value"><select aria-label="Projeto do período" ${!online?'disabled':''} onchange="if(active&&guard())active.project=this.value">${opts(active?.project)}</select><button class="primary" onclick="${active?'stop()':'start(null)'}">${active?'Parar':'Iniciar livre'}</button>${!active&&last?`<span class="resume-wrap"><button onclick="resume()" aria-describedby="resume-tooltip">Retomar último</button><span class="resume-tooltip" id="resume-tooltip" role="tooltip"><strong>${esc(tasks.find(t=>t.id===last.task)?.title||last.description||'Atividade livre')}</strong><span>Projeto: ${esc(last.project||'Sem projeto')}</span></span></span>`:''}</div>`;$('#content').innerHTML=({Quadro:board,Horas:hours,Faturas:invoiceList,Cadastros:registry,Configurações:settings})[page]();$('#state').innerHTML=`<p>${online?'Conectado':'Sem conexão'} · ${active?'Um cronômetro ativo':'Nenhum cronômetro ativo'} · ${records.length} registros · ${invoices.length} faturas</p><p>Última tarefa: ${esc(tasks.find(t=>t.id===active?.task)?.title||'Nenhuma')}. Faturas válidas bloqueiam seus registros. Mover tarefas não altera o cronômetro.</p>`}
function board(){return `<div class="row between"><div><h1>Seu trabalho, em movimento</h1><p class="muted">Quadro global · ${tasks.filter(t=>!t.archived).length} tarefas ativas</p></div><button class="primary" onclick="taskForm()">+ Nova tarefa</button></div><div class="toolbar board-tools"><div class="filter-wrap"><button class="filter-trigger" aria-expanded="false" aria-controls="task-filter" onclick="const menu=document.getElementById('task-filter');menu.hidden=!menu.hidden;this.setAttribute('aria-expanded',String(!menu.hidden))"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>Filtro <span class="muted">${archived?'Arquivadas':'Ativas'}</span><span aria-hidden="true">⌄</span></button><div id="task-filter" class="filter-menu" hidden><span class="muted">Mostrar tarefas</span><label><input type="radio" name="task-status" ${!archived?'checked':''} onchange="archived=false;render()">Ativas</label><label><input type="radio" name="task-status" ${archived?'checked':''} onchange="archived=true;render()">Arquivadas</label></div></div><button class="icon-button" aria-label="Gerenciar colunas" title="Gerenciar colunas" onclick="columnForm()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-.6 2.3-2 .9-2.1-.7-2 3.5 1.6 1.7v2.6L2.3 15l2 3.5 2.2-.7 1.9 1L9 21h4l.6-2.2 2-1 2.1.7 2-3.5-1.6-1.7v-2.6L19.7 9l-2-3.5-2.2.7-1.9-.9L13 3z"/><circle cx="11" cy="12" r="3"/></svg></button></div><select class="mobile-column" aria-label="Coluna do quadro" onchange="col=+this.value;render()">${columns.map((c,i)=>`<option value="${i}" ${i===col?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="board">${columns.map((c,i)=>`<section class="column ${i===col?'shown':''}"><div class="row between"><h2>${esc(c)}</h2><span class="badge">${tasks.filter(t=>t.col===i&&!!t.archived===archived).length}</span></div>${tasks.filter(t=>t.col===i&&!!t.archived===archived).map(t=>`<article class="card"><small>${esc(t.project||'Sem projeto')}</small><h3>${esc(t.title)}</h3><p class="muted">${duration(total(t))}${active?.task===t.id?' · contando':''}</p><div class="row"><button onclick="start(${t.id})" ${t.archived?'disabled':''}>${active?.task===t.id?'Em andamento':'▶ Iniciar'}</button><button onclick="taskForm(${t.id})">Abrir</button></div></article>`).join('')||'<p class="muted">Nenhuma tarefa aqui.</p>'}</section>`).join('')}</div>`}
function taskForm(id){const t=tasks.find(t=>t.id===id);modal(`<h2>${t?'Editar tarefa':'Nova tarefa'}</h2><form onsubmit="saveTask(event,${id||0})"><label>Título<input name="title" value="${esc(t?.title)}" required></label><label>Descrição<textarea name="description">${esc(t?.description)}</textarea></label><label>Projeto<select name="project">${opts(t?.project)}</select></label><label>Coluna<select name="col">${columns.map((c,i)=>`<option value="${i}" ${t?.col===i?'selected':''}>${esc(c)}</option>`).join('')}</select></label><p class="muted">Alterações na tarefa não reescrevem a descrição dos registros de horas.</p><div class="row"><button type="submit" class="primary">Salvar</button><button type="button" onclick="closeModal()">Voltar</button>${t?`<button type="button" onclick="archiveTask(${id})">${t.archived?'Restaurar':'Arquivar'}</button><button type="button" onclick="reorder(${id})">Mover para o início da coluna</button>`:''}</div></form>`)}
function saveTask(e,id){e.preventDefault();if(!guard())return;const f=new FormData(e.target),v={title:f.get('title'),description:f.get('description'),project:f.get('project'),col:+f.get('col')};const t=tasks.find(t=>t.id===id);if(t)Object.assign(t,v);else tasks.push({id:Date.now(),...v});closeModal();render()}
function archiveTask(id){if(!guard())return;const t=tasks.find(t=>t.id===id);if(active?.task===id){notify('Decisão a validar: parar o cronômetro antes de arquivar a tarefa?');return}t.archived=!t.archived;closeModal();render()}function reorder(id){if(!guard())return;const t=tasks.find(t=>t.id===id);tasks=[t,...tasks.filter(t=>t.id!==id)];closeModal();render()}
let draggingColumn=null;
function columnForm(){modal(`<div class="row between"><h2 style="margin:0">Colunas do quadro</h2><button class="icon-button" aria-label="Fechar" onclick="closeModal()">×</button></div><p class="muted">Arraste para mudar a ordem. Edite o nome na própria lista.</p><div class="column-editor">${columns.map((c,i)=>`<div class="column-edit-row" data-column="${i}" ondragover="event.preventDefault();this.classList.add('drop-target')" ondragleave="this.classList.remove('drop-target')" ondrop="event.preventDefault();moveColumn(draggingColumn,${i})"><button type="button" class="drag-handle" draggable="true" aria-label="Arrastar coluna ${esc(c)}. Use as setas para reordenar." title="Arraste ou use as setas do teclado" ondragstart="draggingColumn=${i};event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',String(${i}));this.closest('.column-edit-row').classList.add('dragging')" ondragend="document.querySelectorAll('.column-edit-row').forEach(el=>el.classList.remove('dragging','drop-target'))" onkeydown="if(event.key==='ArrowUp'||event.key==='ArrowDown'){event.preventDefault();moveColumn(${i},${i}+(event.key==='ArrowUp'?-1:1),true)}"><svg width="18" height="22" viewBox="0 0 18 22" fill="currentColor" aria-hidden="true"><circle cx="6" cy="5" r="1.4"/><circle cx="12" cy="5" r="1.4"/><circle cx="6" cy="11" r="1.4"/><circle cx="12" cy="11" r="1.4"/><circle cx="6" cy="17" r="1.4"/><circle cx="12" cy="17" r="1.4"/></svg></button><input aria-label="Nome da coluna ${i+1}" value="${esc(c)}" onchange="if(guard()){if(this.value.trim()){columns[${i}]=this.value.trim();render()}else{this.value=columns[${i}];notify('Dê um nome à coluna.')}}"><button class="remove-column" aria-label="Remover coluna ${esc(c)}" title="Remover coluna" onclick="deleteColumn(${i})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></div>`).join('')}</div><form class="new-column" onsubmit="event.preventDefault();if(!guard())return;const name=this.elements.columnName.value.trim();if(!name)return;columns.push(name);refreshColumns()"><input name="columnName" aria-label="Nome da nova coluna" placeholder="Nova coluna" required><button class="primary" aria-label="Adicionar coluna" title="Adicionar coluna">+</button></form><p class="muted" style="font-size:12px">As alterações são aplicadas na hora. Para remover uma coluna, mova suas tarefas primeiro.</p><div class="row" style="justify-content:flex-end"><button class="primary" onclick="closeModal()">Concluir</button></div>`)}
function refreshColumns(){closeModal();render();columnForm()}
function moveColumn(from,to,focus=false){if(from===null||from===to||to<0||to>=columns.length||!guard())return;const order=columns.map((_,i)=>i);order.splice(to,0,order.splice(from,1)[0]);const old=[...columns];columns.splice(0,columns.length,...order.map(i=>old[i]));tasks.forEach(t=>t.col=order.indexOf(t.col));col=order.indexOf(col);refreshColumns();if(focus)document.querySelectorAll('.drag-handle')[to]?.focus();notify('Ordem das colunas atualizada.')}
function shiftColumn(i){if(!guard())return;[columns[i-1],columns[i]]=[columns[i],columns[i-1]];tasks.forEach(t=>{if(t.col===i)t.col--;else if(t.col===i-1)t.col++});closeModal();render()}function deleteColumn(i){if(!guard())return;if(tasks.some(t=>t.col===i)){notify('Esta coluna contém tarefas. Mova todas antes de removê-la.');return}if(columns.length===1){notify('Decisão a validar: manter pelo menos uma coluna.');return}columns.splice(i,1);tasks.forEach(t=>{if(t.col>i)t.col--});col=0;refreshColumns()}
let filterProject='',filterClient='',from='2026-10-01',to='2026-10-31';function selected(){return records.filter(r=>(!filterProject||r.project===filterProject)&&(!filterClient||projects.find(p=>p.name===r.project)?.client===filterClient)&&r.start.slice(0,10)>=from&&r.start.slice(0,10)<=to)}
function hours(){const rs=selected();return `<div class="row between"><div><h1>Horas</h1><p class="muted">Cada período de trabalho, com sua própria descrição.</p></div><button class="primary" onclick="openManual()">+ Registro manual</button></div><div class="toolbar"><input aria-label="Início do período" type="date" value="${from}" onchange="from=this.value;render()"><input aria-label="Fim do período" type="date" value="${to}" onchange="to=this.value;render()"><select aria-label="Filtrar cliente" onchange="filterClient=this.value;render()"><option value="">Todos os clientes</option>${clients.map(c=>`<option ${c.name===filterClient?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select aria-label="Filtrar projeto" onchange="filterProject=this.value;render()"><option value="">Todos os projetos</option>${projects.map(p=>`<option ${p.name===filterProject?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="row between"><span class="amount">${duration(rs.reduce((n,r)=>n+r.seconds,0))}</span><div class="row"><button onclick="exportForm()">Exportar timesheet</button><button class="primary" onclick="preview()">Preparar fatura</button></div></div><div class="panel">${rs.map(r=>`<details class="record-accordion"><summary><span class="record-heading"><strong>${esc(r.description||'Sem descrição')}</strong><span class="muted">${esc(r.project||'Sem projeto')} · ${r.start.replace('T',' às ')} até ${r.end.slice(11,16)}</span></span><span class="record-duration">${duration(r.seconds)}</span>${r.locked?'<span class="badge">Faturado · bloqueado</span>':''}<span class="record-chevron" aria-hidden="true">⌄</span></summary><div class="record-body">${r.locked?'<p class="notice">Este registro faz parte de uma fatura válida. Cancele a fatura para editar estas horas.</p>':''}<form onsubmit="saveRecord(event,${r.id})"><fieldset ${r.locked?'disabled':''}><label>Descrição<input name="description" value="${esc(r.description)}"></label><label>Projeto<select name="project">${opts(r.project)}</select></label><div class="grid2"><label>Início<input type="datetime-local" name="start" value="${r.start}" required></label><label>Fim<input type="datetime-local" name="end" value="${r.end}" required></label></div><div class="record-error" role="alert"></div><p class="muted">Horários em ${esc(prefs.zone)}. O valor de hora do registro é preservado.</p>${!r.locked?'<div class="row"><button class="primary">Salvar alterações</button><button type="button" onclick="this.form.reset();this.closest(&quot;details&quot;).open=false">Cancelar</button></div>':''}</fieldset></form></div></details>` ).join('')||'<p>Nenhum registro no período.</p>'}</div>`}
function openManual(id){const r=records.find(r=>r.id===id);modal(`<h2>${r?'Editar registro':'Registro manual'}</h2><form onsubmit="saveRecord(event,${id||0})"><label>Descrição<input name="description" value="${esc(r?.description)}"></label><label>Projeto<select name="project">${opts(r?.project)}</select></label><div class="grid2"><label>Início<input type="datetime-local" name="start" value="${r?.start||'2026-10-19T13:00'}" required></label><label>Fim<input type="datetime-local" name="end" value="${r?.end||'2026-10-19T14:00'}" required></label></div><div id="formError" role="alert"></div><p class="muted">Horários em ${esc(prefs.zone)}. O valor de hora do registro é preservado.</p><div class="row"><button class="primary">Salvar registro</button><button type="button" onclick="conflict=false;closeModal()">Voltar</button></div></form>`)}
function saveRecord(e,id){e.preventDefault();if(!guard())return;const f=new FormData(e.target),s=f.get('start'),end=f.get('end');const clash=records.find(r=>r.id!==id&&s<r.end&&end>r.start);if(end<=s||conflict||clash){(e.target.querySelector('.record-error')||$('#formError')).innerHTML=`<div class="notice">${end<=s?'O fim deve ser posterior ao início.':`Conflito com ${esc(clash?.description||'outro período já salvo')}. Ajuste os horários para não sobrepor.`}</div>`;conflict=false;return}const old=records.find(r=>r.id===id);if(old?.locked)return;const rec={id:id||Date.now(),task:old?.task||null,description:f.get('description'),project:f.get('project'),start:s,end,seconds:(new Date(end)-new Date(s))/1000,rate:old?.rate||150};if(old)Object.assign(old,rec);else records.push(rec);if($('#dialog').open)closeModal();render();notify('Registro de horas salvo.')}
function exportForm(){modal(`<h2>Exportar timesheet</h2><p>${selected().length} registros selecionados. Inclui horas sem projeto.</p><label>Idioma<select id="exportLang"><option>Português</option><option>English</option></select></label><label>Moeda<select><option>BRL</option><option>USD</option></select></label><label>Cotação, 1 USD = X BRL<input type="number" min="0.000001" step="any" value="5.20"></label><div class="row"><button class="primary" onclick="csv()">Baixar CSV de demonstração</button><button onclick="notify('PDF simulado. Layout do documento ainda será validado.')">Prévia PDF</button><button onclick="closeModal()">Voltar</button></div>`)}
function csv(){const en=$('#exportLang').value==='English';const rows=[en?['Description','Project','Start','End','Seconds']:['Descrição','Projeto','Início','Fim','Segundos'],...selected().map(r=>[r.description,r.project,r.start,r.end,r.seconds])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='echo-timesheet-demo.csv';a.click();URL.revokeObjectURL(a.href);notify('CSV de demonstração baixado. Valores monetários ainda não simulados no timesheet.')}
let previewRecords=[];function preview(){const rs=selected();previewRecords=rs.filter(r=>r.project&&!r.locked&&r.end.slice(0,10)<=to);const firstClient=clients.find(c=>!c.archived)?.name;previewRecords=previewRecords.filter(r=>projects.find(p=>p.name===r.project)?.client===firstClient);const groups=Object.groupBy(previewRecords,r=>r.project);modal(`<h2>Prévia de fatura</h2><p class="muted">Nenhum número consumido. Nenhuma hora bloqueada.</p><label>Cliente<select id="invoiceClient" disabled>${clients.filter(c=>!c.archived).map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></label><div class="grid2"><label>Idioma<select id="invoiceLang"><option>Português</option><option>English</option></select></label><label>Moeda<select id="invoiceCurrency" onchange="updatePreview()"><option>BRL</option><option>USD</option></select></label></div><label>Cotação, 1 USD = X BRL<input id="fx" type="number" min="0.000001" step="any" value="5.20" oninput="updatePreview()"></label><label>Dados de pagamento<select>${payments.map(p=>`<option>${esc(p)}</option>`).join('')}</select></label>${Object.entries(groups).map(([p,rr])=>`<label>Descrição do serviço · ${esc(p)}<input value="${esc(p)}"></label><p>${duration(rr.reduce((n,r)=>n+r.seconds,0))} · <span class="lineAmount" data-brl="${rr.reduce((n,r)=>n+r.seconds/3600*(r.rate||150),0)}">${money(rr.reduce((n,r)=>n+r.seconds/3600*(r.rate||150),0))}</span></p>`).join('')}<div class="notice">${rs.filter(r=>!previewRecords.includes(r)).map(r=>`${esc(r.description)}: ${r.locked?'já faturado':!r.project?'sem projeto':'atravessa o fim do período'}`).join('<br>')||'Todos os registros encerrados selecionados estão elegíveis.'}${active?'<br>O registro em andamento está excluído. O cronômetro continua.':''}</div><p>Próximo número de ${esc(clients[0]?.name)}: ${nextNumber}</p><p class="muted">Demonstração limitada ao primeiro cliente e a registros de origem BRL. Seleção de outros clientes e conversão de projetos USD ficam para revisão. Dados de empresa e pagamento fictícios. Prévia simplificada para validar o fluxo.</p><div class="row"><button class="primary" ${!previewRecords.length?'disabled':''} onclick="issueInvoice()">Emitir fatura</button><button onclick="closeModal()">Voltar</button></div>`)}
function updatePreview(){const usd=$('#invoiceCurrency').value==='USD',fx=+$('#fx').value;document.querySelectorAll('.lineAmount').forEach(n=>n.textContent=usd?(+n.dataset.brl/fx).toLocaleString('en-US',{style:'currency',currency:'USD'}):money(+n.dataset.brl))}
function issueInvoice(){if(!guard())return;const fx=+$('#fx').value;if(!(fx>0)){notify('Informe uma cotação positiva.');return}const currency=$('#invoiceCurrency').value;invoices.push({number:nextNumber++,records:previewRecords.map(r=>r.id),status:'Emitida',currency,total:previewRecords.reduce((n,r)=>n+r.seconds/3600*(r.rate||150),0)/(currency==='USD'?fx:1),client:$('#invoiceClient').value});previewRecords.forEach(r=>r.locked=true);closeModal();page='Faturas';render();notify('Fatura emitida. Registros bloqueados e número reservado.')}
function invoiceList(){return `<div class="row between"><div><h1>Faturas</h1><p class="muted">Documentos emitidos, pagamentos e cancelamentos.</p></div><button class="primary" onclick="page='Horas';render()">Selecionar horas</button></div><div class="panel">${invoices.map((i,k)=>`<div class="listrow"><div class="grow"><strong>Fatura ${i.number} · ${esc(i.client)}</strong><p>${i.total.toLocaleString('pt-BR',{style:'currency',currency:i.currency})} · ${i.status}${i.paidDate?' · '+i.paidDate:''}</p></div><button onclick="notify('PDF simulado. Baixar novamente preserva o número ${i.number}.')">Ver PDF</button>${i.status!=='Cancelada'?`<button onclick="payment(${k})">${i.status==='Paga'?'Desfazer pagamento':'Marcar paga'}</button><button class="danger" onclick="cancelInvoice(${k})">Cancelar</button>`:''}</div>`).join('')||'<p>Nenhuma fatura emitida. Prepare uma fatura a partir da tela Horas.</p>'}</div>`}
function payment(k){if(!guard())return;const i=invoices[k];if(i.status==='Paga'){i.status='Emitida';delete i.paidDate;render();return}modal(`<h2>Marcar pagamento integral</h2><form onsubmit="event.preventDefault();if(!guard())return;invoices[${k}].status='Paga';invoices[${k}].paidDate=this.date.value;closeModal();render()"><label>Data do pagamento<input name="date" type="date" required value="2026-10-19"></label><button class="primary">Confirmar pagamento</button> <button type="button" onclick="closeModal()">Voltar</button></form>`)}
function cancelInvoice(k){const i=invoices[k];if(i.status==='Paga'){notify('Desfaça a marcação de pagamento antes de cancelar.');return}modal(`<h2>Cancelar fatura ${i.number}?</h2><p>O documento e o número serão preservados. Os registros ficarão disponíveis para edição e nova emissão.</p><button class="danger" onclick="confirmCancel(${k})">Confirmar cancelamento</button> <button onclick="closeModal()">Voltar</button>`)}function confirmCancel(k){if(!guard())return;invoices[k].status='Cancelada';records.filter(r=>invoices[k].records.includes(r.id)).forEach(r=>r.locked=false);closeModal();render()}
function registry(){return `<h1>Cadastros</h1><div class="toolbar"><button onclick="entityForm('client')">+ Cliente</button><button onclick="entityForm('project')">+ Projeto</button><button onclick="archived=!archived;render()">${archived?'Ver ativos':'Ver arquivados'}</button></div><div class="panel"><h2>Clientes</h2>${clients.filter(c=>!!c.archived===archived).map((c)=>`<div class="listrow"><strong class="grow">${esc(c.name)}</strong><button onclick="entityForm('client',${clients.indexOf(c)})">Editar</button><button onclick="toggleEntity('client',${clients.indexOf(c)})">${c.archived?'Restaurar':'Arquivar'}</button></div>`).join('')||'<p>Nenhum cliente nesta lista.</p>'}</div><div class="panel"><h2>Projetos</h2>${projects.filter(p=>!!p.archived===archived).map(p=>`<div class="listrow"><div class="grow"><strong>${esc(p.name)}</strong><p class="muted">${esc(p.client)} · ${p.rate} ${p.currency}/h</p></div><button onclick="entityForm('project',${projects.indexOf(p)})">Editar</button><button onclick="toggleEntity('project',${projects.indexOf(p)})">${p.archived?'Restaurar':'Arquivar'}</button></div>`).join('')||'<p>Nenhum projeto nesta lista.</p>'}</div><p class="muted">Arquivar preserva o histórico. Propagação entre cliente, projetos e tarefas ainda precisa de decisão.</p>`}
function entityForm(type,index=-1){const x=(type==='client'?clients:projects)[index];modal(`<h2>${index<0?'Novo':'Editar'} ${type==='client'?'cliente':'projeto'}</h2><form onsubmit="saveEntity(event,'${type}',${index})"><label>Nome<input name="name" required value="${esc(x?.name)}"></label>${type==='project'?`<label>Cliente<select name="client">${clients.filter(c=>!c.archived).map(c=>`<option ${c.name===x?.client?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Valor de hora<input name="rate" type="number" min="0" step=".01" value="${x?.rate||prefs.rate}" required></label><label>Moeda de origem<select name="currency"><option>BRL</option><option ${x?.currency==='USD'?'selected':''}>USD</option></select></label>`:'<label>Dados para fatura<textarea name="billing" placeholder="Razão social, identificação e endereço"></textarea></label><label>Próximo número de fatura<input type="number" name="next" min="'+nextNumber+'" value="'+nextNumber+'"></label>'}<p class="muted">Campos de cadastro propostos para avaliação.</p><button class="primary">Salvar</button> <button type="button" onclick="closeModal()">Voltar</button></form>`)}
function saveEntity(e,type,index){e.preventDefault();if(!guard())return;const f=Object.fromEntries(new FormData(e.target));if(f.rate)f.rate=+f.rate;const list=type==='client'?clients:projects;if(index<0)list.push({...f,archived:false});else{const old=list[index].name;Object.assign(list[index],f);if(type==='project'){tasks.forEach(t=>{if(t.project===old)t.project=f.name});records.forEach(r=>{if(r.project===old)r.project=f.name})}else projects.forEach(p=>{if(p.client===old)p.client=f.name})}if(f.next)nextNumber=+f.next;closeModal();render()}
function toggleEntity(type,index){if(!guard())return;const x=(type==='client'?clients:projects)[index];x.archived=!x.archived;render();notify('Histórico preservado. Regras de arquivamento em cascata ainda em avaliação.')}
function settings(){return `<h1>Configurações</h1><div class="panel"><h2>Preferências</h2><label>Valor de hora padrão<input type="number" min="0" value="${prefs.rate}" onchange="if(guard())prefs.rate=+this.value"></label><label>Fuso horário<select onchange="if(guard())prefs.zone=this.value"><option ${prefs.zone==='America/Recife'?'selected':''}>America/Recife</option><option ${prefs.zone==='America/Sao_Paulo'?'selected':''}>America/Sao_Paulo</option><option ${prefs.zone==='UTC'?'selected':''}>UTC</option></select></label><p class="muted">Troca de fuso apenas demonstrativa. Datas fixas do exemplo não são recalculadas.</p></div><div class="panel"><h2>Minha empresa</h2>${['Nome ou razão social','CNPJ','Endereço','Telefone'].map(k=>`<label>${k}<input value="${esc(company[k]||'')}" onchange="if(guard())company['${k}']=this.value"></label>`).join('')}<button onclick="if(guard())notify('Dados da empresa guardados nesta demonstração.')">Salvar empresa</button></div><div class="panel"><h2>Dados de pagamento</h2>${payments.map(p=>`<p>${esc(p)}</p>`).join('')}<form onsubmit="event.preventDefault();if(!guard())return;payments.push(this.data.value);render()"><label>Novo conjunto<textarea name="data" required placeholder="Nome do conjunto e informações para receber"></textarea></label><button>Adicionar dados de pagamento</button></form></div>`}
function variant(n){const keys=['A','B','C'];variantKey=keys[(keys.indexOf(variantKey)+n+3)%3];const u=new URL(location);u.searchParams.set('variant',variantKey);history.replaceState({},'',u);render()}let touchColumn=null;document.addEventListener('touchstart',e=>{const handle=e.target.closest('.drag-handle');if(!handle)return;touchColumn=+handle.closest('[data-column]').dataset.column},{passive:true});document.addEventListener('touchmove',e=>{if(touchColumn===null)return;e.preventDefault();const point=e.touches[0],target=document.elementFromPoint(point.clientX,point.clientY)?.closest('[data-column]');document.querySelectorAll('.column-edit-row').forEach(el=>el.classList.toggle('drop-target',el===target))},{passive:false});document.addEventListener('touchend',e=>{if(touchColumn===null)return;const point=e.changedTouches[0],target=document.elementFromPoint(point.clientX,point.clientY)?.closest('[data-column]');const from=touchColumn;touchColumn=null;document.querySelectorAll('.column-edit-row').forEach(el=>el.classList.remove('drop-target'));if(target)moveColumn(from,+target.dataset.column)});document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable||$('#dialog').open)return;if(e.key==='ArrowLeft')variant(-1);if(e.key==='ArrowRight')variant(1)});if(!['A','B','C'].includes(variantKey))variantKey='A';render();setInterval(()=>{if(active){$('#clock').textContent=duration((Date.now()-active.since)/1000)}},1000);
</script></html>
