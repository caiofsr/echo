<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="login-title">
  <title id="login-title">Chave de acesso esculpida com empunhadura arredondada, segredo e dentes em relevo</title>
  <defs>
    <filter id="login-shadow" x="18" y="86" width="96" height="38" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <linearGradient id="key-face" x1="24" y1="24" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ebf6ea"/>
      <stop offset="0.25" stop-color="#bad8bc"/>
      <stop offset="0.6" stop-color="#7aa37d"/>
      <stop offset="1" stop-color="#416645"/>
    </linearGradient>
    <linearGradient id="key-side" x1="30" y1="30" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c7350"/>
      <stop offset="0.6" stop-color="#2d4830"/>
      <stop offset="1" stop-color="#1b3020"/>
    </linearGradient>
    <linearGradient id="key-hole-inner" x1="36" y1="36" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b3020"/>
      <stop offset="0.5" stop-color="#3c5f40"/>
      <stop offset="1" stop-color="#bad8bc"/>
    </linearGradient>
  </defs>

  <g id="login-ground">
    <ellipse cx="68" cy="106" rx="38" ry="6" fill="#1b2e1f" opacity="0.16" filter="url(#login-shadow)"/>
  </g>

  <g id="login-body">
    <!-- Key Side Depth Extrusion (Bottom-Right) -->
    <!-- Bow outer circle flank -->
    <path d="M42 16 A26 26 0 0 1 68 42 L103 77 L103 87 L95 95 L95 91 L87 83 L81 89 L75 83 L57 65 A26 26 0 0 1 16 42 Z" fill="url(#key-side)" transform="translate(2, 3.5)"/>

    <!-- Key Front Solid Silhouette -->
    <!-- Bow center at (42, 42) r=24. Shaft extends down-right to (101, 101) width=12 -->
    <!-- Teeth extend at (81, 81) to (95, 67) -->
    <path d="M42 18 A24 24 0 0 0 18 42 A24 24 0 0 0 42 66 A24 24 0 0 0 54 62.8 L74 82.8 L74 92 Q74 94 76 94 L82 94 Q84 94 84 92 L84 86.8 L88 90.8 L88 98 Q88 100 90 100 L96 100 Q98 100 98 98 L98 90.8 L101.5 94.3 Q104.5 97.3 107.5 94.3 Q110.5 91.3 107.5 88.3 L62.8 43.6 A24 24 0 0 0 66 42 A24 24 0 0 0 42 18 Z" fill="url(#key-face)"/>

    <!-- Sculpted Bow Inner Hole (Revealing deep inner cylinder wall) -->
    <circle cx="42" cy="42" r="10" fill="url(#key-hole-inner)"/>
    <circle cx="42" cy="42" r="8" fill="#152619"/>
    <!-- Bottom-right inner hole bevel highlight -->
    <path d="M37 47 A8 8 0 0 0 49 47" stroke="#bad8bc" stroke-width="1.8" fill="none"/>

    <!-- Key Shaft & Bow Top-Left Highlight Ridge -->
    <path d="M26 30 A24 24 0 0 1 54 30 M58 48 L103 93" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
