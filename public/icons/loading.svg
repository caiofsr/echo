<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="loading-title">
  <title id="loading-title">Indicador de carregamento orbital concêntrico com transição volumétrica suave</title>
  <defs>
    <filter id="loading-shadow" x="12" y="88" width="104" height="34" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="load-track" x1="22" y1="22" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#bad8bc"/>
      <stop offset="0.6" stop-color="#69946d"/>
      <stop offset="0.88" stop-color="#3b5e40"/>
      <stop offset="1" stop-color="#243c28" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="load-side" x1="26" y1="26" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7aa37d"/>
      <stop offset="0.7" stop-color="#385b3d"/>
      <stop offset="1" stop-color="#1c3020" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="load-head" cx="0.35" cy="0.3" r="0.7">
      <stop stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#badaba"/>
      <stop offset="0.85" stop-color="#557e59"/>
      <stop offset="1" stop-color="#2b4730"/>
    </radialGradient>
  </defs>

  <!-- Centered perfectly at (64, 64) for smooth 360 degree .spin rotation -->
  <g id="loading-body">
    <!-- Under/Side Shaded Toroid Layer -->
    <path d="M64 24 A40 40 0 1 1 25.5 54" fill="none" stroke="url(#load-side)" stroke-width="14" stroke-linecap="round" transform="translate(1, 2)"/>

    <!-- Main Volumetric Tubular Track (Spans ~285 degrees) -->
    <path d="M64 24 A40 40 0 1 1 25.5 54" fill="none" stroke="url(#load-track)" stroke-width="13" stroke-linecap="round"/>

    <!-- Inner tubular curvature highlight -->
    <path d="M64 21 A40 40 0 0 1 104 64" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Volumetric Leading Orb / Head at (64, 24) -->
    <circle cx="64" cy="24" r="7.5" fill="url(#load-head)"/>
    <circle cx="62" cy="22" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
