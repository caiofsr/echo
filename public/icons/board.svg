<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="board-title">
  <title id="board-title">Quadro de tarefas com colunas e cartões em perspectiva suave</title>
  <defs>
    <filter id="board-shadow" x="10" y="96" width="108" height="30" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <linearGradient id="board-side" x1="96" y1="26" x2="108" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#466c4c"/>
      <stop offset="0.5" stop-color="#314e36"/>
      <stop offset="1" stop-color="#233a28"/>
    </linearGradient>
    <linearGradient id="board-bottom" x1="28" y1="98" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#314e36"/>
      <stop offset="1" stop-color="#1f3424"/>
    </linearGradient>
    <linearGradient id="board-bevel" x1="24" y1="20" x2="100" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2f0df"/>
      <stop offset="0.25" stop-color="#bad6be"/>
      <stop offset="0.7" stop-color="#8bb08f"/>
      <stop offset="1" stop-color="#608665"/>
    </linearGradient>
    <linearGradient id="board-face" x1="28" y1="28" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7a9f7e"/>
      <stop offset="0.5" stop-color="#678d6b"/>
      <stop offset="1" stop-color="#517555"/>
    </linearGradient>
    <linearGradient id="board-card-face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4f8f2"/>
      <stop offset="1" stop-color="#e3ece1"/>
    </linearGradient>
    <linearGradient id="board-clip" x1="50" y1="14" x2="78" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef6ec"/>
      <stop offset="0.4" stop-color="#cbe0cc"/>
      <stop offset="1" stop-color="#86aa89"/>
    </linearGradient>
  </defs>

  <g id="board-ground">
    <ellipse cx="64" cy="110" rx="44" ry="7" fill="#1b2e1f" opacity="0.16" filter="url(#board-shadow)"/>
  </g>

  <g id="board-body">
    <!-- Right side extrusion -->
    <path d="M98 27 L105 32 Q106 33 106 35 L106 100 Q106 103 103 103 L98 99 Z" fill="url(#board-side)"/>
    <!-- Bottom thickness -->
    <path d="M29 99 L34 103 Q36 104 38 104 L103 104 L98 99 Z" fill="url(#board-bottom)"/>
    <!-- Outer board bevel -->
    <rect x="23" y="21" width="75" height="78" rx="8" fill="url(#board-bevel)"/>
    <!-- Recessed board face -->
    <rect x="26" y="24" width="69" height="72" rx="6" fill="url(#board-face)"/>
    <!-- Column recessed channels -->
    <rect x="29" y="32" width="19" height="60" rx="3" fill="#446647" opacity="0.45"/>
    <rect x="51" y="32" width="19" height="60" rx="3" fill="#446647" opacity="0.45"/>
    <rect x="73" y="32" width="19" height="60" rx="3" fill="#446647" opacity="0.45"/>
  </g>

  <g id="board-cards">
    <!-- Column 1: Card 1 -->
    <rect x="31" y="36" width="15" height="22" rx="2.5" fill="#2d4831" opacity="0.25" transform="translate(0, 1.5)"/>
    <rect x="31" y="36" width="15" height="22" rx="2.5" fill="url(#board-card-face)"/>
    <rect x="33.5" y="40" width="10" height="2" rx="1" fill="#759978"/>
    <rect x="33.5" y="44" width="7" height="2" rx="1" fill="#a4c2a7"/>

    <!-- Column 1: Card 2 -->
    <rect x="31" y="63" width="15" height="18" rx="2.5" fill="#2d4831" opacity="0.25" transform="translate(0, 1.5)"/>
    <rect x="31" y="63" width="15" height="18" rx="2.5" fill="url(#board-card-face)"/>
    <rect x="33.5" y="67" width="9" height="2" rx="1" fill="#759978"/>

    <!-- Column 2: Card (Active / In Progress) -->
    <rect x="53" y="36" width="15" height="28" rx="2.5" fill="#2d4831" opacity="0.25" transform="translate(0, 1.5)"/>
    <rect x="53" y="36" width="15" height="28" rx="2.5" fill="url(#board-card-face)"/>
    <rect x="55.5" y="40" width="10" height="2.5" rx="1" fill="#365b3e"/>
    <rect x="55.5" y="45" width="8" height="2" rx="1" fill="#759978"/>
    <rect x="55.5" y="49" width="6" height="2" rx="1" fill="#a4c2a7"/>
    <rect x="55.5" y="55" width="4" height="4" rx="2" fill="#58855e"/>

    <!-- Column 3: Card 1 (Done) -->
    <rect x="75" y="36" width="15" height="16" rx="2.5" fill="#2d4831" opacity="0.25" transform="translate(0, 1.5)"/>
    <rect x="75" y="36" width="15" height="16" rx="2.5" fill="url(#board-card-face)"/>
    <rect x="77.5" y="40" width="8" height="2" rx="1" fill="#759978"/>
    <path d="M78 46 L80 48 L86 42" stroke="#365b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Column 3: Card 2 -->
    <rect x="75" y="57" width="15" height="20" rx="2.5" fill="#2d4831" opacity="0.25" transform="translate(0, 1.5)"/>
    <rect x="75" y="57" width="15" height="20" rx="2.5" fill="url(#board-card-face)"/>
    <rect x="77.5" y="61" width="10" height="2" rx="1" fill="#759978"/>
    <rect x="77.5" y="65" width="6" height="2" rx="1" fill="#a4c2a7"/>
  </g>

  <!-- Top Clamp Clip -->
  <g id="board-clip-group">
    <rect x="49" y="16" width="23" height="8" rx="3" fill="#203624" opacity="0.3" transform="translate(0, 1.5)"/>
    <rect x="49" y="16" width="23" height="8" rx="3" fill="url(#board-clip)"/>
    <rect x="53" y="18" width="15" height="4" rx="2" fill="#517555"/>
  </g>
</svg>
