<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="show-title">
  <title id="show-title">Olho aberto esculpido com pálpebras volumétricas e pupila profunda</title>
  <defs>
    <filter id="show-shadow" x="12" y="86" width="104" height="32" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <linearGradient id="show-upper-lid" x1="20" y1="26" x2="108" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ebf5e9"/>
      <stop offset="0.3" stop-color="#bad6bc"/>
      <stop offset="0.7" stop-color="#739d76"/>
      <stop offset="1" stop-color="#466d49"/>
    </linearGradient>
    <linearGradient id="show-lower-lid" x1="20" y1="64" x2="108" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#739d76"/>
      <stop offset="0.6" stop-color="#4d7350"/>
      <stop offset="1" stop-color="#2d4930"/>
    </linearGradient>
    <linearGradient id="show-sclera" x1="30" y1="44" x2="98" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f7f0"/>
      <stop offset="1" stop-color="#cde0cb"/>
    </linearGradient>
    <radialGradient id="show-iris" cx="0.4" cy="0.35" r="0.65">
      <stop stop-color="#7eb082"/>
      <stop offset="0.45" stop-color="#4e7852"/>
      <stop offset="0.85" stop-color="#2a492e"/>
      <stop offset="1" stop-color="#182c1b"/>
    </radialGradient>
  </defs>

  <g id="show-ground">
    <ellipse cx="64" cy="104" rx="42" ry="6" fill="#1b2e1f" opacity="0.15" filter="url(#show-shadow)"/>
  </g>

  <g id="show-body">
    <!-- Lower Eyelid Bevel Base -->
    <path d="M14 64 Q64 104 114 64 Q64 112 14 64 Z" fill="url(#show-lower-lid)"/>

    <!-- Almond Eye Opening / Sclera (Eyeball) -->
    <path d="M16 64 Q64 24 112 64 Q64 104 16 64 Z" fill="url(#show-sclera)"/>

    <!-- Upper Lid Cast Shadow inside Sclera -->
    <path d="M16 64 Q64 24 112 64 Q64 42 16 64 Z" fill="#243f28" opacity="0.28"/>

    <!-- Iris (Spherical green volume) -->
    <circle cx="64" cy="64" r="22" fill="url(#show-iris)"/>
    <!-- Outer limbal ring border -->
    <circle cx="64" cy="64" r="22" fill="none" stroke="#1c321e" stroke-width="1.5" opacity="0.8"/>

    <!-- Deep Pupil -->
    <circle cx="64" cy="64" r="10.5" fill="#101e12"/>

    <!-- Soft Matte Cornea Highlight (Upper-Left) -->
    <ellipse cx="56" cy="55" rx="5.5" ry="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="70" cy="71" r="2" fill="#ffffff" opacity="0.4"/>

    <!-- Upper Eyelid Sculpted Hood -->
    <path d="M14 64 Q64 16 114 64 Q64 28 14 64 Z" fill="url(#show-upper-lid)"/>

    <!-- Delicate eyelid crease highlight line -->
    <path d="M22 62 Q64 20 106 62" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
